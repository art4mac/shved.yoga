server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Власного блоку types тут бути НЕ повинно: на рівні server він замінює всю
    # карту, успадковану з mime.types, і весь HTML поїхав би як
    # application/octet-stream. Штатний mime.types nginx 1.27 уже містить
    # avif, webp і woff2.

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Astro збирає у файли (build.format = "file"), тому /privacy → privacy.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Хешовані ассети й шрифти незмінні — кешуємо назавжди
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML не кешуємо: правки текстів мусять бути видні одразу
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Власна сторінка 404. Статус лишається 404 — це не soft-404: підміна на
    # головну (error_page 404 /index.html) віддавала б неіснуючу адресу як 200.
    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
